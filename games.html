<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Games</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #fff;
            width: 420px;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 20px;
            font-size: 2rem;
            text-align: center;
        }

        ol {
            margin: 0;
            padding-left: 20px;
        }

        li {
            padding: 10px 8px;
            border-bottom: 1px solid #eee;
            font-size: 1.05rem;
        }

        li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Favorite Games</h1>
        <ol>
            <li>Minecraft</li>
            <li>Call of Duty</li>
            <li>Crossout</li>
            <li>Titanfall 2</li>
        </ol>
    </div>
</body>
</html>
